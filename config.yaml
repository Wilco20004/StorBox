name: StorBox
version: "1.8.1"
slug: storbox
description: Track where your stuff is — locations, containers, items, tags, and photos
url: https://github.com/Wilco20004/StorBox
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8090
homeassistant_api: true
panel_icon: mdi:archive-outline
panel_title: StorBox
webui: "http://[HOST]:[PORT:8090]/"
ports:
  8090/tcp: 8090
ports_description:
  8090/tcp: StorBox web UI (optional direct access; not required when using Ingress)
options:
  labelforge_url: "http://10.1.1.3:8095"
schema:
  labelforge_url: "str"
